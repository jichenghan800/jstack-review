<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>按钮测试</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>按钮功能测试</h2>
        <div class="mb-3">
            <button class="btn btn-primary me-2" onclick="loadDemo()">Demo 演示</button>
            <button class="btn btn-secondary me-2" onclick="showAIConfig()">AI 配置</button>
            <button class="btn btn-success me-2" onclick="thinkHarder()">Think Harder</button>
        </div>
        <div id="output" class="alert alert-info">点击按钮测试功能...</div>
    </div>

    <script>
        function loadDemo() {
            console.log('Demo按钮被点击');
            document.getElementById('output').innerHTML = '✅ Demo按钮工作正常！';
            document.getElementById('output').className = 'alert alert-success';
        }

        function showAIConfig() {
            console.log('配置按钮被点击');
            document.getElementById('output').innerHTML = '✅ AI配置按钮工作正常！';
            document.getElementById('output').className = 'alert alert-info';
        }

        function thinkHarder() {
            console.log('Think Harder按钮被点击');
            document.getElementById('output').innerHTML = '✅ Think Harder按钮工作正常！';
            document.getElementById('output').className = 'alert alert-warning';
        }

        console.log('✅ 测试页面加载完成');
    </script>
</body>
</html>
