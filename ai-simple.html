<!DOCTYPE html>
<html lang="zh-CN">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="jstack-review-original/jtdajs.render.js"></script>
    <style>
        .upload-area {
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .upload-area:hover {
            border-color: #0d6efd;
            background-color: rgba(13, 110, 253, 0.05);
            transform: translateY(-2px);
        }
        .upload-area.dragover {
            border-color: #0d6efd;
            background-color: rgba(13, 110, 253, 0.1);
            transform: scale(1.02);
        }
        
        /* 进度条增强样式 */
        .bg-gradient-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        /* 阶段指示器样式 */
        .stage-indicator {
            margin-bottom: 10px;
        }
        .stage-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .stage-circle.active {
            background-color: #0d6efd !important;
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }
        .stage-circle.completed {
            background-color: #198754 !important;
        }
        .stage-label {
            display: block;
            color: #6c757d;
            font-size: 0.75rem;
        }
        
        /* 统计信息样式 */
        .stat-item {
            padding: 8px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* 动画效果 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">

            </div>
        </div>

        </div>

                            </div>
                        </div>
                        
                        <!-- 当前阶段 -->

                                </div>
                            </div>
                        </div>

                            <div class="col-3">
                                <div class="stage-indicator" id="stage1">

                                </div>
                            </div>
                            <div class="col-3">

                            </div>

                                <div class="stage-indicator" id="stage3">
                                    <div class="stage-circle bg-secondary">3</div>
                                    <small class="stage-label">AI分析</small>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="stage-indicator" id="stage4">
                                    <div class="stage-circle bg-secondary">4</div>
                                    <small class="stage-label">结果生成</small>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 实时分析信息 -->
                        <div class="mt-4 p-3 bg-light rounded" id="analysisInfo">
                            <h6 class="text-primary mb-2">
                                <i class="fas fa-info-circle"></i> 分析过程说明
                            </h6>
                            <div id="analysisExplanation" class="small text-muted">
                                正在准备分析您的线程转储文件...
                            </div>
                            
                            <!-- 统计信息 -->
                            <div class="row mt-3" id="analysisStats" style="display: none;">
                                <div class="col-md-3">
                                    <div class="stat-item text-center">
                                        <div class="stat-value text-primary" id="threadCount">-</div>
                                        <div class="stat-label">线程数量</div>
                                    </div>
                                </div>
                                <div class="col-md-3">

                                </div>

                                    <div class="stat-item text-center">

                                        <div class="stat-label">等待中</div>
                                    </div>
                                </div>

                    </div>
                </div>
            </div>
        </div>

        function analyzeContent(content, filename) {
            $('#resultsSection').addClass('d-none');
            $('#uploadSection').slideUp(300); // 隐藏上传区域
            $('#progressSection').removeClass('d-none');
            
            // 初始化增强进度管理系统
            progressManager.init();
            progressManager.updateStage(0, `正在解析文件 "${filename}"...`);
            
            // 重置分析结果变量
            window.aiAnalysisResult = null;
            window.traditionalAnalysis = null;
            window.originalContent = content;  // 保存原始内容供后续使用
            window.originalFilename = filename; // 保存原始文件名
            console.log('🔄 开始新的两阶段分析流程');
            
            // 模拟文件解析延迟
            setTimeout(() => {
                // 🔥 阶段1：传统解析 - 使用完整内容进行准确统计
                progressManager.updateStage(1, '使用 jstack-review 原始解析引擎分析线程信息...');
                
                try {
                    // 使用传统解析库进行解析 - 使用完整内容
                    const analysis = new jtda.Analysis('ai_enhanced', filename);
                    analysis.analyze(content); // 使用完整的原始内容
                
                // 提取结构化数据
                const structuredData = {
                    threads: analysis.threads || [],
                    synchronizers: analysis.synchronizers || [],
                    runningMethods: analysis.runningMethods || [],
                    threadsByStatus: analysis.threadsByStatus || {},
                    deadlockStatus: analysis.deadlockStatus,
                    dateString: analysis.dateString,
                    summary: {
                        totalThreads: analysis.threads ? analysis.threads.length : 0,
                        // 使用实际的 threadsByStatus 键名进行准确统计
                        blockedThreads: (analysis.threadsByStatus['waiting to acquire'] || []).length,

            prompt = prompt.replace(/\{是否存在死锁\}/g, hasDeadlocks ? '是' : '否');

                prompt = prompt.replace(/\{SEGMENT_NAME\}/g, segInfo.segmentName || '');

                prompt = prompt.replace(/\{SEGMENT_PRIORITY\}/g, segInfo.segmentPriority || '');
                prompt = prompt.replace(/\{SEGMENT_START\}/g, segInfo.segmentStart || '');

            // 处理综合分析专用占位符
            if (structuredData && structuredData.synthesisInfo) {
                const synInfo = structuredData.synthesisInfo;
                prompt = prompt.replace(/\{SEGMENT_COUNT\}/g, synInfo.segmentCount || '');

                            ? segment.result.content 
                            : segment.result;
                        const summary = resultText.length > 300 ? resultText.substring(0, 300) + '...' : resultText;
                        segmentSummary += `**分段${index + 1}** (${segment.priority}): ${segment.segmentName}\n${summary}\n\n`;
                    });

                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);

        // 计算健康评分的辅助函数
        function calculateHealthScore(summary) {
            let score = 100;
            
            // 基于阻塞线程比例扣分
            if (summary.totalThreads > 0) {
                const blockedRatio = summary.blockedThreads / summary.totalThreads;
                score -= blockedRatio * 40; // 阻塞线程比例过高扣分
            }
            
            // 死锁严重扣分
            if (summary.hasDeadlocks) {
                score -= 30;
            }
            
            // 同步器过多扣分
            if (summary.synchronizerCount > summary.totalThreads * 0.3) {
                score -= 15;
            }
            
            // 运行线程过少扣分
            if (summary.totalThreads > 0) {
                const runningRatio = summary.runningThreads / summary.totalThreads;
                if (runningRatio < 0.1) score -= 20;
            }
            
            return Math.max(10, Math.min(100, Math.round(score)));
        }

                </div>
            `);
            setTimeout(() => $('.alert').fadeOut(), 5000);
        }

        $(document).ready(function() {
            window.aiAnalysisResult = null;
            window.traditionalAnalysis = null;
            console.log('📱 AI增强分析器初始化，支持两阶段分析流程');
            
            console.log('🔧 当前AI配置:', aiConfig);
            console.log('📝 当前自定义提示词配置:', customPrompts);
            
            $('#demoButton').click(loadDemo);
            $('#configButton').click(showAIConfig);
            $('#promptButton').click(showCustomPrompt);
            $('#reuploadBtn').click(() => location.reload());
            
            // 文件上传处理
            $('#fileInput').on('change', handleFileUpload);
            $('#uploadArea').on('dragover', function(e) {
                e.preventDefault();
                $(this).addClass('dragover');
            });
            $('#uploadArea').on('dragleave', function(e) {
                e.preventDefault();
                $(this).removeClass('dragover');
            });
            $('#uploadArea').on('drop', function(e) {
                e.preventDefault();
                $(this).removeClass('dragover');
                const files = e.originalEvent.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });
            
            console.log('✅ AI线程转储分析器已加载');
        });

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            console.log('📁 处理文件:', file.name, '大小:', file.size);
            
            // 检查文件大小（4MB限制）
            if (file.size > 4 * 1024 * 1024) {
                showAlert('文件大小超过4MB限制', 'danger');
                return;
            }
            
            // 检查文件类型
            const validTypes = ['.txt', '.log', '.dump', 'text/plain'];
            const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
            if (!validTypes.includes(fileExtension) && file.type !== 'text/plain') {
                showAlert('请上传支持的文件格式 (.txt, .log, .dump)', 'warning');
                return;
            }
            
            // 读取文件内容
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                console.log('📄 文件读取成功，内容长度:', content.length);
                showAlert(`文件 "${file.name}" 上传成功，开始AI分析...`, 'success');
                
                // 开始分析
                setTimeout(() => {
                    analyzeContent(content, file.name);
                }, 500);
            };
            
            reader.onerror = function() {
                showAlert('文件读取失败，请重试', 'danger');
            };
            
            reader.readAsText(file);
        }
    </script>
</body>
</html>
