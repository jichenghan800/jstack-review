version: '3.8'

services:
  jstack-review:
    build: .
    container_name: jstack-review-app
    ports:
      - "8080:8080"   # Web服务器
      - "8082:8082"   # AutoGen Bedrock API  
      - "3002:3002"   # Bedrock测试API
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs  # 日志持久化
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 可选：添加nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jstack-review
    restart: unless-stopped
    profiles:
      - with-nginx
