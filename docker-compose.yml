version: '3.8'

services:
  jstack-review:
    build: .
    container_name: jstack-review-app
    ports:
      - "${WEB_PORT:-8080}:8080"     # Web服务器
      - "${API_PORT:-8082}:8082"     # AutoGen Bedrock API  
      - "${PROXY_PORT:-8081}:8081"   # API代理服务器
      - "${TEST_PORT:-3002}:3002"    # Bedrock测试API
    environment:
      - NODE_ENV=production
      - WEB_PORT=${WEB_PORT:-8080}
      - API_PORT=${API_PORT:-8082}
      - PROXY_PORT=${PROXY_PORT:-8081}
      - TEST_PORT=${TEST_PORT:-3002}
    volumes:
      - ./logs:/app/logs              # 日志持久化
      - ./config:/app/config          # 配置文件持久化
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 可选：添加nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jstack-review
    restart: unless-stopped
    profiles:
      - with-nginx
