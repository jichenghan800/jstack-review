<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF中文乱码修复测试</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="fas fa-file-pdf"></i> PDF中文乱码修复测试
                </h1>
                
                <div class="alert alert-info">
                    <strong>测试说明：</strong>这个页面用于测试修复后的PDF生成功能，验证中文乱码问题是否已解决。
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>测试控制面板</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <button class="btn btn-primary btn-lg" onclick="setupTestData()">
                                    <i class="fas fa-database"></i> 设置测试数据
                                </button>
                                <button class="btn btn-success btn-lg ms-2" onclick="testPDFGeneration()">
                                    <i class="fas fa-file-pdf"></i> 测试PDF生成
                                </button>
                            </div>
                            <div class="col-md-6">
                                <div class="alert alert-secondary" id="status">
                                    点击"设置测试数据"开始测试...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6>模拟的分析数据</h6>
                            </div>
                            <div class="card-body">
                                <div id="mockData" style="font-family: monospace; font-size: 12px; background: #f8f9fa; padding: 10px; border-radius: 4px;">
                                    未设置测试数据
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h6>测试结果</h6>
                            </div>
                            <div class="card-body">
                                <div id="testResults">
                                    等待测试...
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setupTestData() {
            // 模拟传统解析数据
            window.traditionalAnalysis = {
                summary: {
                    totalThreads: 804,
                    runningThreads: 66,
                    waitingThreads: 713,
                    blockedThreads: 0,
                    synchronizerCount: 328,
                    hasDeadlocks: false
                }
            };
            
            // 模拟包含中文的AI分析结果
            window.aiAnalysisResult = `# 🔍 Java线程转储深度分析报告

## 📊 系统状态概览
- **总线程数**: 804个 (运行66个, 等待713个, 阻塞0个)
- **同步器数**: 328个
- **死锁状态**: ✅ 无死锁

## 🚨 问题识别与分级

### 🔥 P0级问题 (立即处理)
**暂无紧急问题** - 系统未发现死锁或严重阻塞

### ⚡ P1级问题 (24小时内处理)
1. **线程池过度膨胀**
   - Dubbo线程池: 200+线程处于等待状态
   - 影响: 消耗大量内存资源
   - 建议: 调整核心线程池参数

2. **消息队列处理异常**
   - RocketMQ消费者线程大量等待
   - 影响: 消息处理能力下降

### 💡 优化建议

**立即行动项**
1. 🔥 调整Dubbo线程池参数 (corePoolSize: 20, maxPoolSize: 200)
2. ⚡ 优化RocketMQ消费者配置

**中期优化计划**
1. 🛠️ 实施线程池监控
2. 📊 建立性能预警机制

## 📊 监控建议

**关键指标**
- 线程池使用率: < 80%
- 平均响应时间: < 500ms
- 阻塞线程比例: < 10%

## 总结
应用健康评分: 6/10分
整体风险等级: 中等风险
主要优化点: 线程池配置和消息处理机制`;

            $('#mockData').text(`测试数据已设置:
- 总线程数: ${window.traditionalAnalysis.summary.totalThreads}
- 运行中: ${window.traditionalAnalysis.summary.runningThreads}
- 等待中: ${window.traditionalAnalysis.summary.waitingThreads}
- AI分析结果长度: ${window.aiAnalysisResult.length} 字符
- 包含中文和emoji: 是`);

            $('#status').html('<div class="alert alert-success">✅ 测试数据设置完成，可以进行PDF生成测试</div>');
        }
        
        function testPDFGeneration() {
            if (!window.traditionalAnalysis || !window.aiAnalysisResult) {
                $('#testResults').html('<div class="alert alert-warning">⚠️ 请先点击"设置测试数据"</div>');
                return;
            }
            
            $('#status').html('<div class="alert alert-info">⏳ 正在生成PDF测试报告...</div>');
            $('#testResults').html('<div class="alert alert-info"><i class="fas fa-spinner fa-spin"></i> 生成中，请稍候...</div>');
            
            try {
                // 复制修复后的PDF生成逻辑
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                const pageWidth = 210;
                const pageHeight = 297;
                const margin = 20;
                const contentWidth = pageWidth - 2 * margin;
                let currentY = margin;
                
                // 设置英文字体（解决中文乱码问题）
                pdf.setFont('helvetica');
                
                // 标题区域
                pdf.setFillColor(102, 126, 234);
                pdf.rect(0, 0, pageWidth, 60, 'F');
                
                pdf.setTextColor(255, 255, 255);
                pdf.setFontSize(28);
                pdf.text('AI Thread Dump Analysis Report', pageWidth / 2, 25, { align: 'center' });
                
                pdf.setFontSize(12);
                pdf.text(`Generated: ${new Date().toISOString().replace('T', ' ').substring(0, 19)} UTC`, pageWidth / 2, 40, { align: 'center' });
                
                currentY = 80;
                pdf.setTextColor(0, 0, 0);
                
                // 统计概览
                const summary = window.traditionalAnalysis.summary;
                
                pdf.setFillColor(16, 185, 129);
                pdf.rect(margin, currentY, contentWidth, 12, 'F');
                pdf.setTextColor(255, 255, 255);
                pdf.setFontSize(16);
                pdf.text('Thread Statistics Overview', margin + 5, currentY + 8);
                
                currentY += 20;
                pdf.setTextColor(0, 0, 0);
                pdf.setFontSize(12);
                
                // 统计卡片
                const cardWidth = (contentWidth - 10) / 3;
                const cardHeight = 25;
                const cards = [
                    { label: 'Total Threads', value: summary.totalThreads, color: [102, 126, 234] },
                    { label: 'Running', value: summary.runningThreads, color: [16, 185, 129] },
                    { label: 'Waiting', value: summary.waitingThreads, color: [251, 191, 36] },
                    { label: 'Blocked', value: summary.blockedThreads, color: [239, 68, 68] },
                    { label: 'Synchronizers', value: summary.synchronizerCount, color: [59, 130, 246] },
                    { label: 'Deadlocks', value: summary.hasDeadlocks ? 'Detected' : 'None', color: summary.hasDeadlocks ? [239, 68, 68] : [16, 185, 129] }
                ];
                
                cards.forEach((card, index) => {
                    const row = Math.floor(index / 3);
                    const col = index % 3;
                    const x = margin + col * (cardWidth + 5);
                    const y = currentY + row * (cardHeight + 5);
                    
                    // 卡片背景
                    pdf.setFillColor(248, 250, 252);
                    pdf.rect(x, y, cardWidth, cardHeight, 'F');
                    pdf.setDrawColor(226, 232, 240);
                    pdf.rect(x, y, cardWidth, cardHeight, 'S');
                    
                    // 数值
                    pdf.setFontSize(18);
                    pdf.setTextColor(card.color[0], card.color[1], card.color[2]);
                    pdf.text(String(card.value), x + cardWidth/2, y + 12, { align: 'center' });
                    
                    // 标签
                    pdf.setFontSize(10);
                    pdf.setTextColor(107, 114, 128);
                    pdf.text(card.label, x + cardWidth/2, y + 20, { align: 'center' });
                });
                
                currentY += 60;
                
                // AI分析结果
                if (currentY > pageHeight - 100) {
                    pdf.addPage();
                    currentY = margin;
                }
                
                pdf.setFillColor(102, 126, 234);
                pdf.rect(margin, currentY, contentWidth, 12, 'F');
                pdf.setTextColor(255, 255, 255);
                pdf.setFontSize(16);
                pdf.text('AI Analysis Results', margin + 5, currentY + 8);
                
                currentY += 20;
                pdf.setTextColor(55, 65, 81);
                pdf.setFontSize(11);
                
                // 清理AI分析内容 - 应用修复后的逻辑
                let cleanContent = window.aiAnalysisResult
                    .replace(/<[^>]+>/g, '')
                    .replace(/&nbsp;/g, ' ')
                    .replace(/&amp;/g, '&')
                    .replace(/&lt;/g, '<')
                    .replace(/&gt;/g, '>')
                    .replace(/&quot;/g, '"')
                    // 中文术语转英文
                    .replace(/线程转储/g, 'Thread Dump')
                    .replace(/线程/g, 'Thread')
                    .replace(/死锁/g, 'Deadlock')
                    .replace(/阻塞/g, 'Blocked')
                    .replace(/等待/g, 'Waiting')
                    .replace(/运行/g, 'Running')
                    .replace(/同步器/g, 'Synchronizer')
                    .replace(/应用健康/g, 'Application Health')
                    .replace(/评分/g, 'Score')
                    .replace(/风险等级/g, 'Risk Level')
                    .replace(/高风险/g, 'High Risk')
                    .replace(/中风险/g, 'Medium Risk')
                    .replace(/低风险/g, 'Low Risk')
                    .replace(/问题识别/g, 'Issue Identification')
                    .replace(/性能问题/g, 'Performance Issues')
                    .replace(/优化建议/g, 'Optimization Recommendations')
                    .replace(/立即处理/g, 'Immediate Action Required')
                    .replace(/优先处理/g, 'High Priority')
                    .replace(/计划优化/g, 'Planned Optimization')
                    .replace(/监控建议/g, 'Monitoring Recommendations')
                    // 移除非ASCII字符
                    .replace(/[^\x00-\x7F]/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
                
                const sections = cleanContent.split(/\n\s*\n/).filter(section => section.trim());
                
                sections.forEach(section => {
                    if (currentY > pageHeight - 40) {
                        pdf.addPage();
                        currentY = margin;
                    }
                    
                    const lines = pdf.splitTextToSize(section.trim(), contentWidth - 10);
                    const sectionHeight = lines.length * 5 + 8;
                    
                    if (currentY + sectionHeight > pageHeight - margin) {
                        pdf.addPage();
                        currentY = margin;
                    }
                    
                    pdf.setFillColor(255, 255, 255);
                    pdf.rect(margin + 5, currentY, contentWidth - 10, sectionHeight, 'F');
                    pdf.setDrawColor(226, 232, 240);
                    pdf.rect(margin + 5, currentY, contentWidth - 10, sectionHeight, 'S');
                    
                    pdf.text(lines, margin + 10, currentY + 6);
                    currentY += sectionHeight + 5;
                });
                
                // 页脚
                const pageCount = pdf.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    pdf.setPage(i);
                    pdf.setFontSize(9);
                    pdf.setTextColor(107, 114, 128);
                    pdf.text(`Page ${i} of ${pageCount}`, pageWidth - margin, pageHeight - 10, { align: 'right' });
                    if (i === pageCount) {
                        pdf.text(`Generated by jstack-review AI Analyzer • ${new Date().toISOString().replace('T', ' ').substring(0, 19)} UTC`, margin, pageHeight - 10);
                    }
                }
                
                // 保存
                const filename = `PDF_Chinese_Fix_Test_${new Date().getTime()}.pdf`;
                pdf.save(filename);
                
                $('#status').html('<div class="alert alert-success">✅ PDF生成成功！文件已保存</div>');
                $('#testResults').html(`
                    <div class="alert alert-success">
                        <h6><i class="fas fa-check-circle"></i> PDF生成测试完成！</h6>
                        <p><strong>文件名:</strong> ${filename}</p>
                        <p><strong>页数:</strong> ${pageCount} 页</p>
                        <p><strong>修复内容:</strong></p>
                        <ul>
                            <li>✅ 中文标题 → 英文标题</li>
                            <li>✅ 中文标签 → 英文标签</li>
                            <li>✅ 中文术语 → 英文术语</li>
                            <li>✅ 移除emoji和特殊字符</li>
                            <li>✅ 使用Helvetica字体</li>
                            <li>✅ 保持专业外观</li>
                        </ul>
                        <p><strong>测试结果:</strong> 应该不再出现中文乱码问题</p>
                    </div>
                `);
                
                console.log('✅ PDF中文乱码修复测试完成');
                
            } catch (error) {
                $('#status').html('<div class="alert alert-danger">❌ PDF生成失败</div>');
                $('#testResults').html(`
                    <div class="alert alert-danger">
                        <h6><i class="fas fa-exclamation-circle"></i> 测试失败</h6>
                        <p><strong>错误:</strong> ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `);
                console.error('❌ PDF测试失败:', error);
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
