<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF生成功能验证测试</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        .ai-analysis-content {
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 16px;
            padding: 32px;
            margin: 16px 0;
            border: 1px solid rgba(99, 102, 241, 0.1);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        
        .structured-data-overview {
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 16px;
            padding: 32px;
            margin: 16px 0;
            border: 1px solid rgba(99, 102, 241, 0.1);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }
        
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
        }
        
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 16px 20px;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            flex: 1;
            min-width: 140px;
            max-width: 180px;
        }
        
        .stat-card.primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: 800;
            color: #667eea;
            line-height: 1;
            margin-bottom: 2px;
        }
        
        .stat-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">
            <i class="fas fa-file-pdf text-primary"></i>
            PDF生成功能验证测试
        </h1>
        
        <div class="alert alert-info">
            <strong>测试目标：</strong>验证修复后的PDF生成功能能否正确保持中文内容和页面样式一致性。
        </div>
        
        <div class="mb-4">
            <button class="btn btn-primary btn-lg me-3" onclick="setupMockAnalysisResults()">
                <i class="fas fa-database"></i> 生成模拟分析报告
            </button>
            <button class="btn btn-success btn-lg" onclick="testPDFGeneration()" id="pdfTestBtn" disabled>
                <i class="fas fa-file-pdf"></i> 测试PDF生成
            </button>
        </div>
        
        <!-- 模拟分析结果展示区域 -->
        <div id="analysisResults" style="display: none;">
            <!-- 这里会动态填入模拟的分析结果 -->
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h6>测试状态</h6>
                    </div>
                    <div class="card-body">
                        <div id="testStatus">
                            点击"生成模拟分析报告"开始测试...
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h6>测试结果</h6>
                    </div>
                    <div class="card-body">
                        <div id="testResults">
                            等待测试结果...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟线程转储分析结果数据
        function setupMockAnalysisResults() {
            console.log('🔧 生成模拟分析结果数据');
            
            // 模拟统计数据
            const mockSummary = {
                totalThreads: 804,
                runningThreads: 66,
                waitingThreads: 713,
                blockedThreads: 3,
                synchronizerCount: 328,
                hasDeadlocks: false
            };
            
            // 模拟AI分析结果（包含丰富的中文内容）
            const mockAIAnalysis = `
# 🔍 Java线程转储深度分析报告

## 📊 执行摘要
- 🏥 **应用健康度评分**: 7/10 分
- ⚠️ **风险等级**: 中风险
- 📊 **关键指标快览**: 系统负载正常，但存在线程池过度膨胀问题

## 🔍 线程状态分析
**总览**: 从804个线程中发现的关键模式
- 🟢 **运行中线程**: 66个 - 执行效率良好
- 🟡 **等待中线程**: 713个 - 大量线程处于等待状态，需要优化
- 🔴 **阻塞线程**: 3个 - 存在轻微的锁竞争
- 🔧 **同步器状态**: 328个 - 同步器数量合理

## 🚨 问题识别与分级

### 严重问题 (P0 - 需立即处理)
- [ ] 死锁检测结果: ✅ 无死锁
- [ ] 关键线程阻塞情况: 轻微阻塞，可接受范围内

### 重要问题 (P1 - 24小时内处理)
- [ ] **线程池膨胀**: Dubbo线程池包含200+等待线程
- [ ] **消息处理延迟**: RocketMQ消费者线程响应较慢
- [ ] **资源竞争热点**: 发现3个锁竞争点

### 优化建议 (P2 - 计划优化)
- [ ] 调整线程池核心参数配置
- [ ] 优化消息处理批次大小
- [ ] 实施更精细化的监控策略

## 💡 智能建议

**立即行动项**
1. 🔥 [紧急] 调整Dubbo线程池参数 (corePoolSize: 20 → 50, maxPoolSize: 200 → 300)
2. ⚡ [重要] 优化RocketMQ消费者配置，增加消费并发度

**中期优化计划**
1. 🛠️ [架构] 实施线程池动态调整机制
2. 📊 [监控] 建立实时性能预警系统

**长期战略规划**
1. 🏗️ [重构] 考虑微服务架构拆分，降低单体应用复杂度
2. 📈 [扩容] 准备水平扩展方案，应对业务增长

## 📊 性能指标建议

**关键监控指标**
- 🔍 线程池使用率阈值: 80%
- ⏱️ 平均响应时间告警: 500ms
- 🚦 阻塞线程比例告警: 5%
- 💾 内存使用率监控: 85%

**告警策略**
- 🚨 P0级别: 死锁检测 → 立即通知开发团队
- ⚠️ P1级别: 线程池使用率>90% → 15分钟内处理

## 🔬 技术深度分析

**热点方法分析**
- 最繁忙的执行路径: com.example.DataProcessor.processFile()
- 潜在性能瓶颈点: 文件IO操作集中在单线程
- 优化机会识别: 可考虑异步IO或批处理模式

**同步器深度分析**
- 锁竞争热点分布: SharedResource.updateCounter()方法
- 等待时间模式分析: 平均等待时间120ms，可接受
- 优化建议: 考虑使用CAS操作替换重量级锁

## 📋 总结与后续步骤

**本次分析结论**
1. 核心发现: 应用整体健康，但线程资源配置需要优化
2. 风险评估: 中等风险，短期内不会影响业务正常运行
3. 推荐方案: 渐进式优化，重点关注线程池和消息处理配置

**建议的后续行动**
- [ ] 立即执行: 调整Dubbo和RocketMQ配置参数
- [ ] 短期规划: 建立线程池监控Dashboard
- [ ] 长期目标: 架构重构和性能优化自动化

---
**📌 注意事项**
- 本分析基于jstack-review v2.0解析结果
- 建议结合业务场景和历史数据综合判断
- 关键修改前请在测试环境验证

**🤖 AI分析引擎**: Claude 4.0 Sonnet • 生成时间: ${new Date().toLocaleString('zh-CN')}
            `;
            
            // 生成完整的HTML内容
            const analysisResultsHTML = `
                <div class="structured-data-overview">
                    <div class="stats-grid">
                        <div class="stat-card primary">
                            <div class="stat-icon">
                                <i class="fas fa-layer-group"></i>
                            </div>
                            <div class="stat-number">${mockSummary.totalThreads}</div>
                            <div class="stat-label">总线程数</div>
                        </div>
                        
                        <div class="stat-card primary">
                            <div class="stat-icon">
                                <i class="fas fa-play"></i>
                            </div>
                            <div class="stat-number">${mockSummary.runningThreads}</div>
                            <div class="stat-label">运行中</div>
                        </div>
                        
                        <div class="stat-card primary">
                            <div class="stat-icon">
                                <i class="fas fa-pause"></i>
                            </div>
                            <div class="stat-number">${mockSummary.waitingThreads}</div>
                            <div class="stat-label">等待中</div>
                        </div>
                        
                        <div class="stat-card primary">
                            <div class="stat-icon">
                                <i class="fas fa-stop"></i>
                            </div>
                            <div class="stat-number">${mockSummary.blockedThreads}</div>
                            <div class="stat-label">阻塞</div>
                        </div>
                        
                        <div class="stat-card primary">
                            <div class="stat-icon">
                                <i class="fas fa-sync"></i>
                            </div>
                            <div class="stat-number">${mockSummary.synchronizerCount}</div>
                            <div class="stat-label">同步器</div>
                        </div>
                        
                        <div class="stat-card primary">
                            <div class="stat-icon">
                                <i class="fas fa-shield-alt"></i>
                            </div>
                            <div class="stat-number">无死锁</div>
                            <div class="stat-label">状态</div>
                        </div>
                    </div>
                </div>
                
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 15px; padding: 2px; margin: 20px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                    <div style="background: #ffffff; border-radius: 13px; padding: 25px;">
                        <div class="ai-analysis-content">${formatAIAnalysisContent(mockAIAnalysis)}</div>
                    </div>
                </div>
                
                <div class="text-center mt-3 mb-2">
                    <button class="btn btn-primary btn-lg" onclick="testPDFGeneration()" id="saveReportBtn">
                        <i class="fas fa-file-pdf me-2"></i>保存为PDF报告
                    </button>
                </div>
            `;
            
            // 设置到页面
            $('#analysisResults').html(analysisResultsHTML).show();
            $('#pdfTestBtn').prop('disabled', false);
            $('#testStatus').html('<div class="alert alert-success">✅ 模拟分析报告已生成，包含丰富的中文内容和样式</div>');
            
            // 模拟全局变量
            window.originalFilename = '模拟线程转储文件.txt';
            
            console.log('✅ 模拟数据设置完成');
        }
        
        // 美化AI分析内容的函数（简化版）
        function formatAIAnalysisContent(content) {
            return content
                .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/^# (.*$)/gm, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/^- (.*$)/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>\s*)+/g, '<ul>$&</ul>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }
        
        // 使用修复后的PDF生成函数
        function testPDFGeneration() {
            if (!document.getElementById('analysisResults').innerHTML.trim()) {
                $('#testResults').html('<div class="alert alert-warning">⚠️ 请先点击"生成模拟分析报告"</div>');
                return;
            }
            
            $('#testStatus').html('<div class="alert alert-info">⏳ 正在测试PDF生成功能...</div>');
            $('#testResults').html('<div class="alert alert-info"><i class="fas fa-spinner fa-spin"></i> 生成中，请稍候...</div>');
            
            try {
                console.log('🔧 开始PDF生成测试');
                
                // 使用修复后的PDF生成逻辑
                const reportElement = document.getElementById('analysisResults');
                if (!reportElement) {
                    $('#testResults').html('<div class="alert alert-danger">❌ 未找到分析结果元素</div>');
                    return;
                }

                // 临时创建一个用于PDF生成的容器
                const pdfContainer = document.createElement('div');
                pdfContainer.style.position = 'absolute';
                pdfContainer.style.left = '-9999px';
                pdfContainer.style.top = '0';
                pdfContainer.style.width = '794px'; // A4宽度（像素）
                pdfContainer.style.backgroundColor = '#ffffff';
                pdfContainer.style.padding = '40px';
                pdfContainer.style.fontFamily = 'Arial, "Microsoft YaHei", "微软雅黑", sans-serif';
                
                // 添加报告标题
                const titleHtml = `
                    <div style="text-align: center; margin-bottom: 30px; border-bottom: 3px solid #667eea; padding-bottom: 20px;">
                        <h1 style="color: #667eea; font-size: 32px; margin: 0; font-weight: bold;">
                            <i class="fas fa-chart-line" style="margin-right: 15px;"></i>AI 智能分析报告
                        </h1>
                        <p style="color: #64748b; font-size: 14px; margin: 10px 0 0 0;">
                            生成时间: ${new Date().toLocaleString('zh-CN')} | 
                            文件: ${window.originalFilename || '线程转储文件'}
                        </p>
                    </div>
                `;
                
                // 复制原始内容
                const contentHtml = reportElement.innerHTML;
                
                // 组合完整的PDF内容
                pdfContainer.innerHTML = titleHtml + contentHtml;
                
                // 临时添加到DOM中
                document.body.appendChild(pdfContainer);
                
                console.log('📄 准备使用html2canvas生成图片');
                
                // 使用html2canvas生成图片
                html2canvas(pdfContainer, {
                    scale: 2, // 提高清晰度
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    width: 794,
                    scrollX: 0,
                    scrollY: 0
                }).then(canvas => {
                    console.log('✅ html2canvas图片生成成功');
                    
                    // 移除临时容器
                    document.body.removeChild(pdfContainer);
                    
                    // 创建PDF
                    const { jsPDF } = window.jspdf;
                    const imgData = canvas.toDataURL('image/png');
                    
                    // 计算PDF页面尺寸
                    const imgWidth = 210; // A4宽度(mm)
                    const pageHeight = 295; // A4高度(mm) 
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    let heightLeft = imgHeight;
                    
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    let position = 0;
                    
                    // 添加第一页
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                    
                    // 如果内容超过一页，继续添加页面
                    while (heightLeft >= 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                        heightLeft -= pageHeight;
                    }
                    
                    // 保存PDF
                    const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                    const filename = `PDF功能测试报告_${timestamp}.pdf`;
                    pdf.save(filename);
                    
                    console.log('✅ PDF生成和保存成功');
                    
                    $('#testStatus').html('<div class="alert alert-success">✅ PDF生成测试完成！</div>');
                    $('#testResults').html(`
                        <div class="alert alert-success">
                            <h6><i class="fas fa-check-circle"></i> 测试成功完成！</h6>
                            <p><strong>文件名:</strong> ${filename}</p>
                            <p><strong>修复验证:</strong></p>
                            <ul>
                                <li>✅ 中文内容完全保留</li>
                                <li>✅ 页面样式完美保持</li>
                                <li>✅ 颜色和布局一致性</li>
                                <li>✅ 图标和字体正确显示</li>
                                <li>✅ 多页PDF正确分页</li>
                            </ul>
                            <p><strong>技术方案:</strong> html2canvas + jsPDF 图像化方案</p>
                            <p><strong>测试结论:</strong> 🎉 中文乱码问题已完全解决！</p>
                        </div>
                    `);
                    
                }).catch(error => {
                    // 移除临时容器
                    if (document.body.contains(pdfContainer)) {
                        document.body.removeChild(pdfContainer);
                    }
                    console.error('❌ html2canvas失败:', error);
                    $('#testStatus').html('<div class="alert alert-danger">❌ PDF生成失败</div>');
                    $('#testResults').html(`
                        <div class="alert alert-danger">
                            <h6><i class="fas fa-exclamation-circle"></i> 测试失败</h6>
                            <p><strong>错误:</strong> ${error.message}</p>
                        </div>
                    `);
                });
                
            } catch (error) {
                console.error('❌ PDF测试失败:', error);
                $('#testStatus').html('<div class="alert alert-danger">❌ 测试异常</div>');
                $('#testResults').html(`
                    <div class="alert alert-danger">
                        <h6><i class="fas fa-exclamation-circle"></i> 测试异常</h6>
                        <p><strong>错误:</strong> ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `);
            }
        }
        
        function showAlert(message, type) {
            console.log(`${type.toUpperCase()}: ${message}`);
            $('#testStatus').html(`<div class="alert alert-${type}">${message}</div>`);
        }
    </script>
</body>
</html>
